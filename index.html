<title>大和出擊</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: a single 16:9 stage centred on a dark page, with a short control and drop legend underneath. */
:root {
  --bg: #0a1017;
  --panel: #121b24;
  --line: #2a3a47;
  --fg: #dde6ec;
  --muted: #8ea0ad;
  --amber: #f0a93c;
  --green: #5fd18a;
  --body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 400 14px/1.7 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font: 900 24px/1.2 var(--body); letter-spacing: .08em; }
.sub { color: var(--muted); font-size: 13px; }
.stage { border: 1px solid var(--line); background: #000; line-height: 0; }
canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; touch-action: none; cursor: pointer; }
.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
.chip { background: var(--panel); border: 1px solid var(--line); padding: 8px 12px; display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: center; font-size: 13px; line-height: 1.5; }
.chip b { display: block; font-weight: 700; }
.chip span.d { color: var(--muted); font-size: 12.5px; }
.dot { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 700 12px/1 var(--body); color: #fff; border: 2px solid rgba(255,255,255,.85); }
.hint { color: var(--muted); font-size: 13px; }
kbd { font: 500 12px/1 var(--body); background: var(--panel); border: 1px solid var(--line); padding: 2px 6px; }
</style>

<div class="wrap">
  <header>
    <h1>大和出擊</h1>
    <span class="sub">DEMO · 3 關 · 每關一隻 Boss</span>
  </header>
  <div class="stage"><canvas id="c" width="960" height="540" aria-label="橫向捲軸戰艦遊戲畫面"></canvas></div>
  <p class="hint">操作：<kbd>←</kbd> <kbd>→</kbd> 或 <kbd>A</kbd> <kbd>D</kbd> 移動。手機請在畫面上按住左右。主砲與防空砲會自動開火。</p>
  <div class="legend">
    <div class="chip"><span class="dot" style="background:#2fa866">＋</span><div><b>維修包</b><span class="d">回復 30 點耐久</span></div></div>
    <div class="chip"><span class="dot" style="background:#e0703a">散</span><div><b>散彈主砲</b><span class="d">多方向齊射，重複撿取升級</span></div></div>
    <div class="chip"><span class="dot" style="background:#3a8fe0">追</span><div><b>追蹤飛彈</b><span class="d">自動追擊敵人</span></div></div>
    <div class="chip"><span class="dot" style="background:#8a5ae0">魚</span><div><b>重型魚雷</b><span class="d">水下貫穿，專打潛艦與 Boss</span></div></div>
  </div>
</div>

<script>
(() => {
const cv = document.getElementById('c'), g = cv.getContext('2d');
const W = 960, H = 540, WL = 392, TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const FONT = '"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';

/* ---------- sprites ---------- */
function poly(c, pts, fill) {
  c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
  c.closePath(); c.fillStyle = fill; c.fill();
}
function rect(c, x, y, w, h, f) { c.fillStyle = f; c.fillRect(x, y, w, h); }

function turret(c, cx, by, dir, lift) {
  if (lift) rect(c, cx - 19, by - lift, 38, lift, '#66757f');
  const b = by - lift, P = ([dx, dy]) => [cx + dir * dx, b + dy];
  poly(c, [[-20, 0], [-16, -18], [12, -18], [18, -6], [16, 0]].map(P), '#8996a1');
  for (let k = 0; k < 3; k++) {
    const y = b - 13 + k * 4;
    c.fillStyle = '#2b363f';
    c.fillRect(dir > 0 ? cx + 14 : cx - 14 - 48, y, 48, 3);
  }
  rect(c, cx - 8, b - 22, 16, 4, '#66757f');
}

function drawYamato(c) {
  poly(c, [[0, -18], [10, -26], [200, -26], [250, -29], [296, -34], [301, -27], [280, 0], [20, 0], [5, -8]], '#6b7984');
  poly(c, [[6, -7], [286, -7], [280, 0], [20, 0]], '#6e3a33');
  rect(c, 10, -28, 200, 2, '#3f4c56');
  c.fillStyle = 'rgba(225,235,240,.55)';
  for (let x = 24; x < 270; x += 11) c.fillRect(x, -17, 2, 2);
  // aircraft crane and catapult aft
  rect(c, 8, -29, 22, 3, '#3f4c56');
  c.strokeStyle = '#56656f'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(18, -28); c.lineTo(12, -50); c.lineTo(30, -44); c.stroke();
  // turrets: C faces aft, B superfiring, A forward
  turret(c, 52, -26, -1, 0);
  turret(c, 196, -26, 1, 16);
  turret(c, 240, -26, 1, 0);
  // funnel
  poly(c, [[80, -26], [84, -58], [100, -58], [108, -26]], '#56656f');
  rect(c, 83, -61, 18, 3, '#232e35');
  // pagoda tower
  const tiers = [[112, 162, -26, -46], [116, 158, -46, -60], [120, 154, -60, -72], [124, 150, -72, -84], [127, 147, -84, -94], [130, 144, -94, -102], [133, 141, -102, -110]];
  tiers.forEach((t, i) => {
    rect(c, t[0], t[3], t[1] - t[0], t[2] - t[3], i % 2 ? '#8996a1' : '#7c8a95');
    rect(c, t[0] + 3, t[3] + 4, t[1] - t[0] - 6, 3, '#1c2830');
  });
  rect(c, 118, -80, 38, 3, '#2b363f');
  c.strokeStyle = '#9fb0bb'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(137, -110); c.lineTo(137, -134); c.moveTo(129, -124); c.lineTo(145, -124); c.stroke();
  rect(c, 131, -100, 12, 2, '#cfd9df');
  // AA mounts
  [68, 168, 114, 270].forEach(x => { rect(c, x, -32, 7, 5, '#4a5863'); rect(c, x + 3, -38, 2, 7, '#2b363f'); });
}
const SP = { ox: 60, oy: 150, w: 420, h: 190 };
const yamato = (() => {
  const cn = document.createElement('canvas'); cn.width = SP.w; cn.height = SP.h;
  const c = cn.getContext('2d'); c.translate(SP.ox, SP.oy); drawYamato(c); return cn;
})();

function drawPlane(c, x, y, s, col, t) {
  c.save(); c.translate(x, y); c.scale(s, s);
  c.fillStyle = col; c.beginPath(); c.ellipse(0, 0, 18, 5, 0, 0, TAU); c.fill();
  poly(c, [[-4, -1], [8, -1], [3, -13], [-5, -13]], col);
  poly(c, [[-4, 1], [8, 1], [3, 12], [-5, 12]], 'rgba(0,0,0,.28)');
  poly(c, [[14, -1], [20, -1], [23, -9], [18, -9]], col);
  rect(c, -9, -5, 7, 3, '#b8e0f0');
  c.fillStyle = '#e04b3c'; c.beginPath(); c.arc(4, -7, 2.2, 0, TAU); c.fill();
  c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = 1.5;
  const a = t * 40; c.beginPath(); c.moveTo(-19, Math.sin(a) * 7); c.lineTo(-19, -Math.sin(a) * 7); c.stroke();
  c.restore();
}
function drawSub(c, x, y) {
  c.save(); c.translate(x, y);
  c.fillStyle = '#2a3b47'; c.beginPath(); c.ellipse(0, 4, 36, 10, 0, 0, TAU); c.fill();
  rect(c, -6, -12, 16, 12, '#33485a'); rect(c, 2, -20, 2, 8, '#33485a');
  rect(c, -34, 2, 8, 2, '#46606f');
  c.fillStyle = '#e04b3c'; c.fillRect(-1, -8, 5, 2);
  c.restore();
}
function drawBoat(c, x, y) {
  c.save(); c.translate(x, y);
  poly(c, [[-46, -8], [40, -8], [46, 0], [-40, 0]].map(p => [p[0], p[1] - 0]), '#58414a');
  poly(c, [[-46, -12], [38, -12], [46, -6], [40, 0], [-44, 0]], '#6a4f58');
  rect(c, -8, -30, 24, 18, '#7f6670'); rect(c, -4, -42, 16, 12, '#8d747e');
  rect(c, -24, -26, 10, 14, '#4e3840'); rect(c, -40, -20, 14, 8, '#7f6670');
  rect(c, -54, -18, 16, 3, '#2b2327');
  rect(c, 22, -20, 12, 8, '#7f6670'); rect(c, 10, -18, 14, 3, '#2b2327');
  c.restore();
}
function drawBoss(c, e, t) {
  c.save(); c.translate(e.x, e.y + e.h / 2 - 4);
  if (e.kind === 'carrier') {
    poly(c, [[-146, -28], [-120, 0], [136, 0], [144, -26]], '#4d5a63');
    poly(c, [[-146, -30], [144, -30], [144, -26], [-146, -26]], '#2c363d');
    rect(c, -140, -33, 284, 4, '#7a8a95');
    rect(c, 74, -70, 36, 40, '#6a7a86'); rect(c, 80, -84, 24, 14, '#7c8c98');
    rect(c, 86, -96, 3, 14, '#9fb0bb'); rect(c, 60, -50, 12, 20, '#56656f');
    rect(c, 78, -64, 28, 4, '#1c2830');
    drawPlane(c, -90, -41, 0.9, '#8c4a44', 0); drawPlane(c, -40, -41, 0.9, '#8c4a44', 0); drawPlane(c, 10, -41, 0.9, '#8c4a44', 0);
    c.fillStyle = 'rgba(255,255,255,.35)'; for (let x = -118; x < 130; x += 14) c.fillRect(x, -16, 3, 3);
  } else if (e.kind === 'battleship') {
    poly(c, [[-156, -34], [-132, 0], [140, 0], [152, -30]], '#4d5a63');
    rect(c, -150, -38, 296, 5, '#7a8a95');
    rect(c, 20, -60, 52, 26, '#6a7a86'); rect(c, 28, -86, 36, 26, '#7c8c98'); rect(c, 34, -106, 24, 20, '#6a7a86');
    rect(c, 44, -128, 3, 22, '#9fb0bb'); rect(c, 80, -64, 24, 30, '#56656f'); rect(c, 22, -78, 48, 3, '#1c2830');
    [[-100, 0], [-52, 14], [100, 0]].forEach(([x, lift]) => {
      if (lift) rect(c, x - 17, -38 - lift, 34, lift, '#5a6a75');
      const b = -38 - lift;
      poly(c, [[x - 20, b], [x - 14, b - 20], [x + 14, b - 20], [x + 20, b]], '#7c8c98');
      for (let k = 0; k < 2; k++) rect(c, x - 14 - 50, b - 14 + k * 5, 50, 3, '#2b363f');
    });
    c.fillStyle = 'rgba(255,255,255,.35)'; for (let x = -128; x < 130; x += 14) c.fillRect(x, -20, 3, 3);
  } else {
    c.fillStyle = '#3b5468'; c.beginPath(); c.ellipse(0, -8, 140, 38, 0, 0, TAU); c.fill();
    c.fillStyle = '#4a6a82'; c.beginPath(); c.ellipse(-10, -16, 120, 24, 0, 0, TAU); c.fill();
    rect(c, 10, -70, 44, 36, '#3b5366'); rect(c, 20, -92, 24, 22, '#46607a'); rect(c, 30, -120, 3, 28, '#9fb0bb');
    [[-70, -38], [-110, -30]].forEach(([x, y]) => { rect(c, x - 14, y - 12, 28, 12, '#46607a'); rect(c, x - 52, y - 8, 40, 4, '#1e2a33'); });
    c.fillStyle = '#ff5a4a'; for (let i = 0; i < 6; i++) { c.globalAlpha = .55 + .45 * Math.sin(t * 5 + i); c.fillRect(-100 + i * 36, -12, 6, 4); }
    c.globalAlpha = 1;
  }
  c.restore();
}

/* ---------- stage config ---------- */
const STG = [
  { name: '晴空海域', sky: ['#4f9fd0', '#cbe9f4'], sea: ['#1f7392', '#0b3a52'], sun: '#fff6d0', sx: 720, sy: 100, cloud: 'rgba(255,255,255,.8)', isl: '#4d7872', boss: 'carrier', bn: '敵航空母艦', hp: 90, len: 32, gap: 1.05 },
  { name: '黃昏航線', sky: ['#d9683f', '#f7c682'], sea: ['#7f4d58', '#2a2340'], sun: '#ffe3a3', sx: 690, sy: 250, cloud: 'rgba(255,214,170,.55)', isl: '#4f333f', boss: 'battleship', bn: '敵戰艦', hp: 150, len: 36, gap: 0.9 },
  { name: '暴風之夜', sky: ['#080f20', '#27395d'], sea: ['#16304a', '#060d18'], sun: '#dfe8ff', sx: 240, sy: 90, cloud: 'rgba(70,85,118,.7)', isl: '#121c30', boss: 'fortress', bn: '深海要塞', hp: 210, len: 40, gap: 0.78 }
];
const WEAP = {
  spread: { name: '散彈主砲', col: '#e0703a', ch: '散' },
  homing: { name: '追蹤飛彈', col: '#3a8fe0', ch: '追' },
  torpedo: { name: '重型魚雷', col: '#8a5ae0', ch: '魚' }
};
const WKEYS = Object.keys(WEAP);

/* ---------- state ---------- */
let G;
function reset(mode) {
  G = {
    mode, stage: 1, t: 0, clock: 0, spawnT: 1, score: 0, boss: null, bossDone: false, clearT: 0, banner: 2.4, warn: 0,
    p: { x: 150, hp: 100, max: 100, inv: 0, w: { k: null, lv: 0 }, cdM: .3, cdA: 0, cdS: 0.5, bob: 0 },
    en: [], eb: [], pb: [], it: [], pt: [], tx: [], shake: 0, stars: Array.from({ length: 60 }, () => [rnd(0, W), rnd(0, 220), rnd(.5, 1.6)])
  };
}
reset('title');

const keys = { l: false, r: false }, ptr = { down: false, x: 0 };
function begin() { reset('play'); }
function nextStage() {
  const s = G.stage + 1;
  if (s > 3) { G.mode = 'win'; return; }
  G.stage = s; G.t = 0; G.boss = null; G.bossDone = false; G.spawnT = 1; G.banner = 2.4; G.mode = 'play';
  G.en.length = G.eb.length = 0; G.p.hp = Math.min(G.p.max, G.p.hp + 25);
}
function action() {
  if (G.mode === 'title' || G.mode === 'dead' || G.mode === 'win') begin();
  else if (G.mode === 'clear') nextStage();
}
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.l = true;
  else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.r = true;
  if (['ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
  if (G.mode !== 'play' && !e.metaKey && !e.ctrlKey && !e.altKey && e.key.length > 0 && e.key !== 'Shift') action();
});
addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.l = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.r = false;
});
function pxy(e) { const r = cv.getBoundingClientRect(); return (e.clientX - r.left) / r.width * W; }
cv.addEventListener('pointerdown', e => { ptr.down = true; ptr.x = pxy(e); cv.setPointerCapture(e.pointerId); if (G.mode !== 'play') action(); });
cv.addEventListener('pointermove', e => { if (ptr.down) ptr.x = pxy(e); });
const up = () => { ptr.down = false; };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);

/* ---------- helpers ---------- */
const E = {
  plane: () => ({ t: 'plane', w: 38, h: 18, hp: 2, vx: -rnd(130, 190), y0: rnd(70, 290), amp: rnd(10, 45), ph: rnd(0, TAU), sh: rnd(1, 3), sc: 10 }),
  bomber: () => ({ t: 'bomber', w: 70, h: 28, hp: 7, vx: -75, y0: rnd(60, 130), amp: 6, ph: rnd(0, TAU), sh: 1, sc: 30 }),
  boat: () => ({ t: 'boat', w: 100, h: 44, hp: 10, vx: -55, y0: WL - 22, amp: 0, ph: 0, sh: rnd(1, 2.2), sc: 25 }),
  sub: () => ({ t: 'sub', w: 76, h: 34, hp: 8, vx: -65, y0: WL + 8, amp: 0, ph: 0, sh: rnd(1.5, 3), sc: 35 })
};
function spawn() {
  const s = G.stage, r = Math.random();
  let k;
  if (s === 1) k = r < .72 ? 'plane' : 'boat';
  else if (s === 2) k = r < .4 ? 'plane' : r < .6 ? 'bomber' : r < .8 ? 'boat' : 'sub';
  else k = r < .35 ? 'plane' : r < .55 ? 'bomber' : r < .7 ? 'boat' : 'sub';
  addEnemy(k, W + 70);
}
function addEnemy(k, x, y) {
  const e = E[k](); e.x = x; e.y = y != null ? y : e.y0; e.maxhp = e.hp; e.flash = 0; e.age = 0; G.en.push(e); return e;
}
function boom(x, y, n, sz, col) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, TAU), v = rnd(30, 220) * sz;
    G.pt.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30, life: rnd(.3, .8), max: .8, r: rnd(2, 6) * sz, col: col || (Math.random() < .5 ? '#ffb23d' : '#ff6a3a') });
  }
}
function say(x, y, s, col) { G.tx.push({ x, y, s, col, life: 1.4 }); }
function pcenter() { return [G.p.x + 150, WL - 45]; }
function ebullet(x, y, vx, vy, o) { G.eb.push(Object.assign({ x, y, vx, vy, r: 5, g: 0, dmg: 8 }, o || {})); }
function aim(x, y, sp, spread) {
  const [px, py] = pcenter(); let a = Math.atan2(py - y, px - x) + (spread || 0);
  return [Math.cos(a) * sp, Math.sin(a) * sp];
}
function drop(e) {
  const r = Math.random();
  if (r < .2) G.it.push({ x: e.x, y: e.y, vy: -60, k: WKEYS[Math.floor(Math.random() * 3)], t: 0 });
  else if (r < .4) G.it.push({ x: e.x, y: e.y, vy: -60, k: 'heal', t: 0 });
}
function hurt(e, d) {
  e.hp -= d; e.flash = .08;
  if (e.hp <= 0 && !e.dead) kill(e);
}
function kill(e) {
  e.dead = true; G.score += e.sc || 500;
  if (e.boss) {
    boom(e.x, e.y, 90, 2, null); G.shake = .8; G.bossDone = true; G.clearT = 3;
    for (let i = 0; i < 3; i++) G.it.push({ x: e.x + (i - 1) * 50, y: e.y - 20, vy: -140, k: i === 1 ? WKEYS[Math.floor(Math.random() * 3)] : 'heal', t: 0 });
    G.eb.length = 0; G.en.forEach(o => { if (o !== e && !o.dead) { o.dead = true; boom(o.x, o.y, 14, 1); } });
  } else { boom(e.x, e.y, e.t === 'bomber' || e.t === 'boat' ? 26 : 14, e.t === 'plane' ? .8 : 1.2); drop(e); }
}
function inRect(x, y, e, m) { return Math.abs(x - e.x) < e.w / 2 + m && Math.abs(y - e.y) < e.h / 2 + m; }
function nearest(x, y, air) {
  let b = null, bd = 1e9;
  for (const e of G.en) { if (e.dead) continue; if (air && e.y > WL - 20) continue; const d = Math.hypot(e.x - x, e.y - y); if (d < bd) { bd = d; b = e; } }
  return b ? [b, bd] : null;
}

/* ---------- boss ---------- */
function spawnBoss() {
  const c = STG[G.stage - 1];
  const dims = { carrier: [290, 70, WL - 30], battleship: [310, 96, WL - 44], fortress: [290, 96, WL - 20] }[c.boss];
  const b = { t: 'boss', boss: true, kind: c.boss, x: W + 200, y: dims[2], w: dims[0], h: dims[1], hp: c.hp, maxhp: c.hp, flash: 0, age: 0, sc: 1000 * G.stage, cd: [2, 3, 1.5, 4], ty: dims[2] };
  G.en.push(b); G.boss = b; G.warn = 2.4;
}
function bossAI(b, dt) {
  b.age += dt;
  const tx = 640 + Math.sin(b.age * .5) * 50;
  b.x += clamp(tx - b.x, -80 * dt, 80 * dt);
  b.cd[0] -= dt; b.cd[1] -= dt; b.cd[2] -= dt;
  if (b.x > W - 40) return;
  const ph = b.hp < b.maxhp * .5 ? 1 : 0, sp = ph ? .7 : 1;
  if (b.kind === 'carrier') {
    if (b.cd[0] < 0) { b.cd[0] = 2.3 * sp; addEnemy('plane', b.x - 120, WL - 80); addEnemy('plane', b.x - 80, WL - 100); }
    if (b.cd[1] < 0) { b.cd[1] = 2.6 * sp; for (let i = -1; i <= 1; i++) { const [vx, vy] = aim(b.x - 140, b.y - 20, 230, i * .16); ebullet(b.x - 140, b.y - 20, vx, vy); } }
    if (ph && b.cd[2] < 0) { b.cd[2] = 1.4; const [vx, vy] = aim(b.x - 140, b.y, 280); ebullet(b.x - 140, b.y, vx, vy, { r: 7, dmg: 10 }); }
  } else if (b.kind === 'battleship') {

    if (b.cd[1] < 0) { b.cd[1] = .9 * sp; const [vx, vy] = aim(b.x - 20, b.y - 80, 260, rnd(-.1, .1)); ebullet(b.x - 20, b.y - 80, vx, vy); }
    if (ph && b.cd[2] < 0) { b.cd[2] = 3; addEnemy('plane', b.x - 60, WL - 150); addEnemy('boat', b.x + 40, WL - 22).vx = -90; }
  } else {
    if (b.cd[0] < 0) { b.cd[0] = 2.4 * sp; for (let i = 0; i < 7; i++) { const a = Math.PI + (i - 3) * .28; ebullet(b.x - 110, b.y - 40, Math.cos(a) * 240, Math.sin(a) * 240); } }
    if (b.cd[1] < 0) { b.cd[1] = 1.8 * sp; const [vx, vy] = aim(b.x - 20, b.y - 100, 300); ebullet(b.x - 20, b.y - 100, vx, vy, { r: 7, dmg: 12 }); }

/* ---------- update ---------- */
function update(dt) {
  G.clock += dt;
  const p = G.p, cfg = STG[G.stage - 1], play = G.mode === 'play', live = play || G.mode === 'title';
  p.bob = Math.sin(G.clock * 1.6) * 1.6;
  // movement
  let dir = 0;
  if (G.mode === 'title') {
    const it = G.it[0], tgt = it ? it.x - 150 : 200 + Math.sin(G.clock * .5) * 120;
    dir = Math.abs(tgt - p.x) < 6 ? 0 : Math.sign(tgt - p.x); p.hp = p.max;
  } else if (play) {
    dir = (keys.r ? 1 : 0) - (keys.l ? 1 : 0);
    if (ptr.down) { const tg = ptr.x - 150; dir = Math.abs(tg - p.x) < 6 ? 0 : Math.sign(tg - p.x); }
  }
  p.x = clamp(p.x + dir * 230 * dt, 30, 500);
  p.inv = Math.max(0, p.inv - dt);
  G.shake = Math.max(0, G.shake - dt); G.banner = Math.max(0, G.banner - dt); G.warn = Math.max(0, G.warn - dt);

  if (live) {
    // stage timeline
    if (G.mode === 'title') { G.t += dt; if (G.t > cfg.len - 4) G.t = 8; }
    else if (!G.boss) { G.t += dt; if (G.t >= cfg.len) spawnBoss(); }
    if (!G.boss) { G.spawnT -= dt; if (G.spawnT <= 0) { G.spawnT = cfg.gap * rnd(.7, 1.3); spawn(); } }
    fire(dt);
  }

  // player bullets

      if (n) { const [e] = n, ta = Math.atan2(e.y - b.y, e.x - b.x); let d = ta - b.a; d = Math.atan2(Math.sin(d), Math.cos(d)); b.a += clamp(d, -5 * dt, 5 * dt); }
      b.sp = Math.min(380, b.sp + 260 * dt); b.vx = Math.cos(b.a) * b.sp; b.vy = Math.sin(b.a) * b.sp;
      if (Math.random() < .6) G.pt.push({ x: b.x, y: b.y, vx: 0, vy: 0, life: .3, max: .3, r: 3, col: '#cfe3ff' });
    }
    b.vy += (b.g || 0) * dt; b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.kind === 'shell' && b.y > WL + 24) { b.life = 0; boom(b.x, WL + 6, 3, .4, '#cfe9f3'); }
    for (const e of G.en) {
      if (e.dead || b.life <= 0) continue;
      if (b.kind === 'tor' && e.y < WL - 40 - 0 && e.t !== 'boss') continue;
      if (b.kind === 'tor' && e.t === 'plane') continue;
      if (inRect(b.x, b.y, e, b.r)) {
        if (b.hit && b.hit.has(e)) continue;
        hurt(e, b.dmg); boom(b.x, b.y, 3, .5);
        if (b.pierce) (b.hit = b.hit || new Set()).add(e); else b.life = 0;
      }
    }
  }
  G.pb = G.pb.filter(b => b.life > 0 && b.x < W + 40 && b.x > -40 && b.y > -40);

  // enemies
  const [pcx, pcy] = pcenter();
  for (const e of G.en) {
    if (e.dead) continue;
    e.flash = Math.max(0, e.flash - dt); e.age += dt;
    if (e.boss) { bossAI(e, dt); continue; }
    e.x += e.vx * dt;
    if (e.t === 'plane') {
      e.y = e.y0 + Math.sin(e.age * 2 + e.ph) * e.amp;
      e.sh -= dt; if (G.stage > 1 && e.sh < 0 && e.x < W - 80 && e.x > pcx) { e.sh = rnd(2, 3.5); const [vx, vy] = aim(e.x, e.y, 210); ebullet(e.x, e.y, vx, vy, { r: 4 }); }
    } else if (e.t === 'bomber') {
      e.y = e.y0 + Math.sin(e.age + e.ph) * e.amp;
      e.sh -= dt; if (e.sh < 0 && Math.abs(e.x - pcx) < 150 && e.x < W - 50) { e.sh = 1.2; ebullet(e.x, e.y + 12, e.vx * .6, 40, { g: 420, r: 6, dmg: 10, bomb: true }); }
    } else {
      e.sh -= dt;
      if (e.sh < 0 && e.x < W - 60 && e.x > pcx + 60) {
        e.sh = e.t === 'boat' ? rnd(2.2, 3.2) : rnd(2.5, 3.6);
        const [vx, vy] = aim(e.x, e.y - 14, 230); ebullet(e.x, e.y - 14, vx, vy, { r: 5 });
      }
    }
    // ram
    const hb = { x: p.x + 150, y: WL - 40, w: 260, h: 100 };
    if (G.mode === 'play' && Math.abs(e.x - hb.x) < (e.w + hb.w) / 2 && Math.abs(e.y - hb.y) < (e.h + hb.h) / 2) {
      if (p.inv <= 0) damage(12); e.hp = 0; kill(e);
    }
    if (e.x < -140) e.dead = true;
  }
  G.en = G.en.filter(e => !e.dead);
  if (G.boss && G.boss.dead) G.boss = null;

  // enemy bullets
  for (const b of G.eb) {
    b.vy += b.g * dt; b.x += b.vx * dt; b.y += b.vy * dt;
    if (G.mode === 'play' && p.inv <= 0 && Math.abs(b.x - (p.x + 150)) < 135 + b.r && b.y > WL - 112 && b.y < WL + 8) { damage(b.dmg); b.dead = true; boom(b.x, b.y, 8, .7); }
    if (b.y > WL + 20 || b.x < -30 || b.x > W + 60 || b.y < -60) b.dead = true;
  }
  G.eb = G.eb.filter(b => !b.dead);

  // items
  for (const it of G.it) {
    it.t += dt; it.vy += 260 * dt; it.y += it.vy * dt; it.x -= 38 * dt;
    if (it.y > WL - 12) { it.y = WL - 12 + Math.sin(it.t * 3) * 2; it.vy = 0; }
    if (Math.abs(it.x - (p.x + 150)) < 150 && it.y > WL - 120 && it.y < WL + 4 && G.mode !== 'dead') { it.got = true; pickup(it); }
    if (it.x < -30) it.got = true;
  }
  G.it = G.it.filter(i => !i.got);

  for (const q of G.pt) { q.life -= dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 200 * dt * (q.max > .5 ? 1 : 0); }
  G.pt = G.pt.filter(q => q.life > 0);
  for (const t of G.tx) { t.life -= dt; t.y -= 24 * dt; }
  G.tx = G.tx.filter(t => t.life > 0);

  if (G.bossDone && G.mode === 'play') { G.clearT -= dt; if (G.clearT <= 0) G.mode = 'clear'; }
}
function damage(d) {
  const p = G.p; p.hp -= d; p.inv = .5; G.shake = .25; boom(p.x + 140, WL - 50, 8, .8, '#ff8a4a');
  if (p.hp <= 0) { p.hp = 0; G.mode = 'dead'; boom(p.x + 150, WL - 40, 80, 2); }
}
function pickup(it) {
  const p = G.p;
  if (it.k === 'heal') { p.hp = Math.min(p.max, p.hp + 30); say(it.x, it.y - 20, '耐久 +30', '#5fd18a'); }
  else {
    if (p.w.k === it.k) p.w.lv = Math.min(3, p.w.lv + 1); else { p.w.k = it.k; p.w.lv = 1; }
    say(it.x, it.y - 20, WEAP[it.k].name + (p.w.lv > 1 ? ' Lv' + p.w.lv : ' 已裝備'), WEAP[it.k].col === '#8a5ae0' ? '#c4a6ff' : '#ffd37a');
  }
}
function fire(dt) {
  const p = G.p, y = WL + p.bob;
  p.cdM -= dt; p.cdA -= dt; p.cdS -= dt;
  if (p.cdM <= 0) {
    p.cdM = .75;
    G.pb.push({ kind: 'shell', x: p.x + 302, y: y - 35, vx: 560, vy: -30, g: 250, dmg: 4, r: 5, life: 3 });
    G.pb.push({ kind: 'shell', x: p.x + 258, y: y - 51, vx: 560, vy: -45, g: 250, dmg: 4, r: 5, life: 3 });
    boom(p.x + 306, y - 35, 4, .4, '#ffe29a'); boom(p.x + 262, y - 51, 4, .4, '#ffe29a');
  }
  if (p.cdA <= 0) {
    const n = nearest(p.x + 140, y - 100, true);
    if (n && n[1] < 520) {
      p.cdA = .17; const [e] = n, a = Math.atan2(e.y - (y - 100), e.x - (p.x + 140)) + rnd(-.04, .04);
      G.pb.push({ kind: 'aa', x: p.x + 140, y: y - 100, vx: Math.cos(a) * 620, vy: Math.sin(a) * 620, dmg: 1, r: 3, life: 1.2 });
    }
  }

    if (w.k === 'spread') {

      set.forEach(vy => G.pb.push({ kind: 'shell', x: p.x + 302, y: y - 35, vx: 520, vy, g: 250, dmg: 3, r: 4, life: 3 }));
    } else if (w.k === 'homing') {
      p.cdS = 1.1;

    } else {
      p.cdS = 1.2;
      for (let i = 0; i < w.lv; i++) G.pb.push({ kind: 'tor', x: p.x + 270 - i * 22, y: WL + 16 + i * 9, vx: 300, vy: 0, dmg: 9, r: 5, life: 4, pierce: true });
    }
  }
}

/* ---------- render ---------- */
function txt(s, x, y, size, col, al, wt) {
  g.font = (wt || 700) + ' ' + size + 'px ' + FONT; g.fillStyle = col; g.textAlign = al || 'left'; g.textBaseline = 'alphabetic'; g.fillText(s, x, y);
}
function bar(x, y, w, h, f, col, bg) {

  g.fillStyle = col; g.fillRect(x + 2, y + 2, Math.max(0, (w - 4) * f), h - 4);
  g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 1; g.strokeRect(x + .5, y + .5, w - 1, h - 1);
}
function background(cfg, t) {
  let gr = g.createLinearGradient(0, 0, 0, WL); gr.addColorStop(0, cfg.sky[0]); gr.addColorStop(1, cfg.sky[1]);
  g.fillStyle = gr; g.fillRect(0, 0, W, WL + 1);

  g.fillStyle = cfg.sun; g.beginPath(); g.arc(cfg.sx, cfg.sy, G.stage === 3 ? 28 : 46, 0, TAU); g.fill();
  if (G.stage === 3) { g.fillStyle = cfg.sky[0]; g.beginPath(); g.arc(cfg.sx + 12, cfg.sy - 4, 26, 0, TAU); g.fill(); }
  g.fillStyle = cfg.cloud;
  for (let i = 0; i < 6; i++) {
    const x = ((i * 220 - t * (8 + i * 3)) % (W + 300) + W + 300) % (W + 300) - 150, y = 50 + (i * 53) % 150;
    g.beginPath(); g.ellipse(x, y, 70, 16, 0, 0, TAU); g.ellipse(x + 40, y - 10, 46, 14, 0, 0, TAU); g.ellipse(x - 44, y + 4, 40, 11, 0, 0, TAU); g.fill();

  }

  g.fillStyle = gr; g.fillRect(0, WL, W, H - WL);

  for (let r = 0; r < 4; r++) {
    g.beginPath(); for (let x = -20; x <= W + 20; x += 20) { const y = WL + 18 + r * 28 + Math.sin(x * .03 + t * (1 + r * .3) + r) * 3; x === -20 ? g.moveTo(x, y) : g.lineTo(x, y); } g.stroke();

  g.lineTo(W, H); g.closePath(); g.fillStyle = cfg.sea[0]; g.globalAlpha = .55; g.fill(); g.globalAlpha = 1;
  g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 1.5; g.beginPath();

function render() {
