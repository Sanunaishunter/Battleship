<title>大和砲擊</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: a single 16:9 stage centred on a dark page, with touch buttons and a short guide underneath. */
:root {
  --bg: #0a1017;
  --panel: #121b24;
  --line: #2a3a47;
  --fg: #dde6ec;
  --muted: #8ea0ad;
  --amber: #f0a93c;
  --body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 400 14px/1.7 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font: 900 24px/1.2 var(--body); letter-spacing: .08em; }
.sub { color: var(--muted); font-size: 13px; }
.stage { border: 1px solid var(--line); background: #000; line-height: 0; }
canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; touch-action: none; cursor: crosshair; }
.touch { display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 8px; }
.touch button { font: 700 16px/1 var(--body); padding: 16px 8px; background: var(--panel); color: var(--fg); border: 1px solid var(--line); touch-action: none; user-select: none; -webkit-user-select: none; }
.touch button:active, .touch button.on { background: var(--amber); color: #1a1205; border-color: var(--amber); }
.guide { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 8px; }
.chip { background: var(--panel); border: 1px solid var(--line); padding: 10px 14px; font-size: 13px; line-height: 1.6; }
.chip b { display: block; font-weight: 700; margin-bottom: 2px; }
.chip span { color: var(--muted); }
kbd { font: 500 12px/1 var(--body); background: var(--bg); border: 1px solid var(--line); padding: 2px 6px; }
</style>

<div class="wrap">
  <header>
    <h1>大和砲擊</h1>
    <span class="sub">DEMO · 3 關 · 每關一隻 Boss · 過關用點數強化</span>
  </header>
  <div class="stage"><canvas id="c" width="960" height="540" aria-label="艦砲射擊遊戲畫面"></canvas></div>
  <div class="touch" aria-label="觸控按鈕">
    <button id="bl" type="button">◀ 左移</button>
    <button id="br" type="button">右移 ▶</button>
    <button id="bm" type="button">特殊飛彈</button>
  </div>
  <div class="guide">
    <div class="chip"><b>瞄準與開火</b><span>滑鼠移動調整砲口角度，按住左鍵開火。手機直接在畫面上按住瞄準。</span></div>
    <div class="chip"><b>移動與飛彈</b><span><kbd>←</kbd> <kbd>→</kbd> 移動，<kbd>↑</kbd> 發射特殊飛彈（會自動追敵）。</span></div>
    <div class="chip"><b>強化系統</b><span>每關過後用點數強化：砲彈數、裝填速度、射擊精度、機動性、耐久、特殊飛彈。</span></div>
  </div>
</div>

<script>
(() => {
const cv = document.getElementById('c'), g = cv.getContext('2d');
const W = 960, H = 540, WL = 392, TAU = Math.PI * 2, GR = 380, V0 = 620;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const FONT = '"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';

/* ---------- sprites ---------- */
function poly(c, pts, fill) {
  c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
  c.closePath(); c.fillStyle = fill; c.fill();
}
function rect(c, x, y, w, h, f) { c.fillStyle = f; c.fillRect(x, y, w, h); }
function turret(c, cx, by, dir, lift) {
  if (lift) rect(c, cx - 19, by - lift, 38, lift, '#66757f');
  const b = by - lift, P = ([dx, dy]) => [cx + dir * dx, b + dy];
  poly(c, [[-20, 0], [-16, -18], [12, -18], [18, -6], [16, 0]].map(P), '#8996a1');
  for (let k = 0; k < 3; k++) { c.fillStyle = '#2b363f'; c.fillRect(dir > 0 ? cx + 14 : cx - 14 - 48, b - 13 + k * 4, 48, 3); }
  rect(c, cx - 8, b - 22, 16, 4, '#66757f');
}
function drawYamato(c) {
  poly(c, [[0, -18], [10, -26], [200, -26], [250, -29], [296, -34], [301, -27], [280, 0], [20, 0], [5, -8]], '#6b7984');
  poly(c, [[6, -7], [286, -7], [280, 0], [20, 0]], '#6e3a33');
  rect(c, 10, -28, 200, 2, '#3f4c56');
  c.fillStyle = 'rgba(225,235,240,.55)';
  for (let x = 24; x < 270; x += 11) c.fillRect(x, -17, 2, 2);
  rect(c, 8, -29, 22, 3, '#3f4c56');
  c.strokeStyle = '#56656f'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(18, -28); c.lineTo(12, -50); c.lineTo(30, -44); c.stroke();
  turret(c, 52, -26, -1, 0); turret(c, 196, -26, 1, 16); turret(c, 240, -26, 1, 0);
  poly(c, [[80, -26], [84, -58], [100, -58], [108, -26]], '#56656f');
  rect(c, 83, -61, 18, 3, '#232e35');
  [[112, 162, -26, -46], [116, 158, -46, -60], [120, 154, -60, -72], [124, 150, -72, -84], [127, 147, -84, -94], [130, 144, -94, -102], [133, 141, -102, -110]].forEach((t, i) => {
    rect(c, t[0], t[3], t[1] - t[0], t[2] - t[3], i % 2 ? '#8996a1' : '#7c8a95');
    rect(c, t[0] + 3, t[3] + 4, t[1] - t[0] - 6, 3, '#1c2830');
  });
  rect(c, 118, -80, 38, 3, '#2b363f');
  c.strokeStyle = '#9fb0bb'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(137, -110); c.lineTo(137, -134); c.moveTo(129, -124); c.lineTo(145, -124); c.stroke();
  rect(c, 131, -100, 12, 2, '#cfd9df');
  [68, 168, 114, 270].forEach(x => { rect(c, x, -32, 7, 5, '#4a5863'); rect(c, x + 3, -38, 2, 7, '#2b363f'); });
}
const SP = { ox: 60, oy: 150 };
const yamato = (() => {
  const cn = document.createElement('canvas'); cn.width = 420; cn.height = 190;
  const c = cn.getContext('2d'); c.translate(SP.ox, SP.oy); drawYamato(c); return cn;
})();
function drawPlane(c, x, y, s, col, t) {
  c.save(); c.translate(x, y); c.scale(s, s);
  c.fillStyle = col; c.beginPath(); c.ellipse(0, 0, 18, 5, 0, 0, TAU); c.fill();
  poly(c, [[-4, -1], [8, -1], [3, -13], [-5, -13]], col);
  poly(c, [[-4, 1], [8, 1], [3, 12], [-5, 12]], 'rgba(0,0,0,.28)');
  poly(c, [[14, -1], [20, -1], [23, -9], [18, -9]], col);
  rect(c, -9, -5, 7, 3, '#b8e0f0');
  c.fillStyle = '#e04b3c'; c.beginPath(); c.arc(4, -7, 2.2, 0, TAU); c.fill();
  c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = 1.5;
  const a = t * 40; c.beginPath(); c.moveTo(-19, Math.sin(a) * 7); c.lineTo(-19, -Math.sin(a) * 7); c.stroke();
  c.restore();
}
function drawBoat(c, x, y, s, flash) {
  c.save(); c.translate(x, y); c.scale(s, s);
  poly(c, [[-46, -12], [38, -12], [46, -6], [40, 0], [-44, 0]], flash ? '#fff' : '#6a4f58');
  rect(c, -8, -30, 24, 18, '#7f6670'); rect(c, -4, -42, 16, 12, '#8d747e');
  rect(c, -24, -26, 10, 14, '#4e3840'); rect(c, -40, -20, 14, 8, '#7f6670');
  rect(c, -54, -18, 16, 3, '#2b2327');
  rect(c, 22, -20, 12, 8, '#7f6670'); rect(c, 10, -18, 14, 3, '#2b2327');
  c.restore();
}
function drawTurret(c, x, y, flash) {
  c.save(); c.translate(x, y);
  rect(c, -17, -2, 34, 16, flash ? '#fff' : '#4a4038');
  c.fillStyle = flash ? '#fff' : '#6a5a4c'; c.beginPath(); c.arc(0, -2, 13, Math.PI, 0); c.fill();
  c.strokeStyle = '#2b2327'; c.lineWidth = 5; c.beginPath(); c.moveTo(-4, -8); c.lineTo(-30, -26); c.stroke();
  c.restore();
}
function drawBoss(c, e, t) {
  c.save(); c.translate(e.x, e.y + e.h / 2 - 4);
  if (e.kind === 'carrier') {
    poly(c, [[-146, -28], [-120, 0], [136, 0], [144, -26]], '#4d5a63');
    poly(c, [[-146, -30], [144, -30], [144, -26], [-146, -26]], '#2c363d');
    rect(c, -140, -33, 284, 4, '#7a8a95');
    rect(c, 74, -70, 36, 40, '#6a7a86'); rect(c, 80, -84, 24, 14, '#7c8c98');
    rect(c, 86, -96, 3, 14, '#9fb0bb'); rect(c, 60, -50, 12, 20, '#56656f');
    rect(c, 78, -64, 28, 4, '#1c2830');
    drawPlane(c, -90, -41, 0.9, '#8c4a44', 0); drawPlane(c, -40, -41, 0.9, '#8c4a44', 0); drawPlane(c, 10, -41, 0.9, '#8c4a44', 0);
    c.fillStyle = 'rgba(255,255,255,.35)'; for (let x = -118; x < 130; x += 14) c.fillRect(x, -16, 3, 3);
  } else if (e.kind === 'battleship') {
    poly(c, [[-156, -34], [-132, 0], [140, 0], [152, -30]], '#4d5a63');
    rect(c, -150, -38, 296, 5, '#7a8a95');
    rect(c, 20, -60, 52, 26, '#6a7a86'); rect(c, 28, -86, 36, 26, '#7c8c98'); rect(c, 34, -106, 24, 20, '#6a7a86');
    rect(c, 44, -128, 3, 22, '#9fb0bb'); rect(c, 80, -64, 24, 30, '#56656f'); rect(c, 22, -78, 48, 3, '#1c2830');
    [[-100, 0], [-52, 14], [100, 0]].forEach(([x, lift]) => {
      if (lift) rect(c, x - 17, -38 - lift, 34, lift, '#5a6a75');
      const b = -38 - lift;
      poly(c, [[x - 20, b], [x - 14, b - 20], [x + 14, b - 20], [x + 20, b]], '#7c8c98');
      for (let k = 0; k < 2; k++) rect(c, x - 14 - 50, b - 14 + k * 5, 50, 3, '#2b363f');
    });
    c.fillStyle = 'rgba(255,255,255,.35)'; for (let x = -128; x < 130; x += 14) c.fillRect(x, -20, 3, 3);
  } else {
    c.fillStyle = '#3b5468'; c.beginPath(); c.ellipse(0, -8, 140, 38, 0, 0, TAU); c.fill();
    c.fillStyle = '#4a6a82'; c.beginPath(); c.ellipse(-10, -16, 120, 24, 0, 0, TAU); c.fill();
    rect(c, 10, -70, 44, 36, '#3b5366'); rect(c, 20, -92, 24, 22, '#46607a'); rect(c, 30, -120, 3, 28, '#9fb0bb');
    [[-70, -38], [-110, -30]].forEach(([x, y]) => { rect(c, x - 14, y - 12, 28, 12, '#46607a'); rect(c, x - 52, y - 8, 40, 4, '#1e2a33'); });
    c.fillStyle = '#ff5a4a'; for (let i = 0; i < 6; i++) { c.globalAlpha = .55 + .45 * Math.sin(t * 5 + i); c.fillRect(-100 + i * 36, -12, 6, 4); }
    c.globalAlpha = 1;
  }
  c.restore();
}

/* ---------- data ---------- */
const STG = [
  { name: '晴空海域', sky: ['#4f9fd0', '#cbe9f4'], sea: ['#1f7392', '#0b3a52'], sun: '#fff6d0', sx: 840, sy: 160, cloud: 'rgba(255,255,255,.8)', isl: '#4d7872', land: '#3f6a4c', turrets: 0, quota: 10, gap: 2.3, mix: { boat: .5, plane: .5 }, boss: 'carrier', bn: '敵航空母艦', hp: 150 },
  { name: '黃昏海岸', sky: ['#d9683f', '#f7c682'], sea: ['#7f4d58', '#2a2340'], sun: '#ffe3a3', sx: 690, sy: 250, cloud: 'rgba(255,214,170,.55)', isl: '#4f333f', land: '#5a4636', turrets: 2, quota: 14, gap: 2.0, mix: { boat: .35, cruiser: .15, plane: .35, bomber: .15 }, boss: 'battleship', bn: '敵戰艦', hp: 260 },
  { name: '暴風之夜', sky: ['#080f20', '#27395d'], sea: ['#16304a', '#060d18'], sun: '#dfe8ff', sx: 240, sy: 90, cloud: 'rgba(70,85,118,.7)', isl: '#121c30', land: '#1d2b3c', turrets: 3, quota: 18, gap: 1.7, mix: { boat: .25, cruiser: .25, plane: .3, bomber: .2 }, boss: 'fortress', bn: '深海要塞', hp: 420 }
];
const DIFF = [
  { n: '簡單', hp: .7, dmg: .6, fire: 1.4, err: 140, pts: 12, guide: true, d: '有彈道輔助線，敵人較弱' },
  { n: '普通', hp: 1, dmg: 1, fire: 1, err: 100, pts: 8, guide: false, d: '標準難度' },
  { n: '困難', hp: 1.5, dmg: 1.4, fire: .7, err: 60, pts: 5, guide: false, d: '敵人更硬、更準、更快' }
];
const UP = [
  { k: 'shots', n: '砲彈數', d: '每次齊射的砲彈數量', f: l => l + ' 發' },
  { k: 'reload', n: '裝填速度', d: '兩次齊射之間的間隔', f: l => reloadT(l).toFixed(2) + ' 秒' },
  { k: 'acc', n: '射擊精度', d: '砲彈散布角度，越小越準', f: l => '±' + spreadD(l).toFixed(1) + '°' },
  { k: 'move', n: '機動性', d: '戰艦左右移動速度', f: l => speedV(l) + ' px/s' },
  { k: 'hull', n: '耐久', d: '戰艦最大耐久', f: l => hullV(l) },
  { k: 'missile', n: '特殊飛彈', d: '飛彈數量與威力（↑ 鍵發射）', f: l => ammoV(l) + ' 枚 · 威力 ' + misDmg(l) }
];
const MAXLV = 6;
const reloadT = l => 1.8 - .22 * (l - 1), spreadD = l => 6.5 - .9 * (l - 1), speedV = l => 100 + 28 * (l - 1);
const hullV = l => 100 + 40 * (l - 1), ammoV = l => 1 + 2 * l, misDmg = l => 14 + 6 * l;
const MUZ = [[302, -35], [258, -51], [70, -40]];
const LAND = [[760, WL], [790, WL - 34], [830, WL - 58], [890, WL - 66], [960, WL - 70]];

/* ---------- state ---------- */
let G, btns = [];
const keys = { l: false, r: false, f: false, m: false };
const mouse = { x: 700, y: 250, down: false };
const D = () => DIFF[G.diff];
function blankLv() { return { shots: 1, reload: 1, acc: 1, move: 1, hull: 1, missile: 1 }; }
function reset(mode) {
  const prev = G;
  G = {
    mode, diff: prev ? prev.diff : 1, stage: 1, t: 0, clock: 0, spawnT: 1.5, spawned: 0, killed: 0, score: 0, boss: null, bossDone: false, clearT: 0,
    banner: 0, warn: 0, shake: 0, gain: 0, lv: blankLv(), pts: 0,
    p: { x: 120, hp: 100, max: 100, inv: 0, cd: .3, mcd: 0, ammo: 3, bob: 0, q: [] },
    en: [], es: [], ps: [], pt: [], tx: [], stars: Array.from({ length: 60 }, () => [rnd(0, W), rnd(0, 220), rnd(.5, 1.6)])
  };
  if (mode === 'title') G.lv = { shots: 3, reload: 3, acc: 3, move: 2, hull: 3, missile: 1 };
}
function newRun(diff) { reset('upgrade'); G.diff = diff; G.pts = DIFF[diff].pts; }
function startStage() {
  const p = G.p, cfg = STG[G.stage - 1];
  p.max = hullV(G.lv.hull); p.hp = p.max; p.ammo = ammoV(G.lv.missile); p.x = 120; p.cd = .5; p.q.length = 0; p.inv = 0;
  G.en.length = G.es.length = G.ps.length = G.pt.length = G.tx.length = 0;
  G.t = 0; G.spawned = 0; G.killed = 0; G.spawnT = 1.5; G.boss = null; G.bossDone = false; G.banner = 2.4; G.warn = 0; G.mode = 'play';
  for (let i = 0; i < cfg.turrets; i++) { const x = [826, 880, 932][i]; addEnemy('turret', x, groundY(x) - 12); }
}
reset('title');

function groundY(x) {
  if (!STG[G.stage - 1].turrets || x < LAND[0][0]) return WL;
  for (let i = 1; i < LAND.length; i++) if (x <= LAND[i][0]) { const a = LAND[i - 1], b = LAND[i]; return a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0]); }
  return LAND[LAND.length - 1][1];
}
function buy(i) { const u = UP[i]; if (G.pts > 0 && G.lv[u.k] < MAXLV) { G.lv[u.k]++; G.pts--; } }
function stageClearReward() { const p = G.p; return 6 + G.stage + (p.hp / p.max > .6 ? 2 : 0); }
function pick(fn) { // run a menu action
  fn();
}

/* ---------- input ---------- */
function xy(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; }
cv.addEventListener('pointerdown', e => {
  const [x, y] = xy(e); mouse.x = x; mouse.y = y; cv.setPointerCapture(e.pointerId);
  if (G.mode === 'play') { mouse.down = true; return; }
  for (const b of btns) if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { b.fn(); return; }
});
cv.addEventListener('pointermove', e => { const [x, y] = xy(e); mouse.x = x; mouse.y = y; });
const release = () => { mouse.down = false; };
cv.addEventListener('pointerup', release); cv.addEventListener('pointercancel', release);
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.l = true;
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.r = true;
  else if (k === ' ') keys.f = true;
  else if (k === 'ArrowUp' || k === 'w' || k === 'W') keys.m = true;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(k)) e.preventDefault();
  const m = G.mode;
  if (m === 'title') { if (k >= '1' && k <= '3') newRun(+k - 1); }
  else if (m === 'upgrade') { if (k >= '1' && k <= '6') buy(+k - 1); else if (k === 'Enter' || k === ' ') startStage(); }
  else if (m === 'clear') { if (k === 'Enter' || k === ' ') toUpgrade(); }
  else if (m === 'dead') { if (k === 'Enter' || k === ' ') startStage(); else if (k === 'Escape') reset('title'); }
  else if (m === 'win') { if (k === 'Enter' || k === ' ') reset('title'); }
});
addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.l = false;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.r = false;
  if (k === ' ') keys.f = false;
  if (k === 'ArrowUp' || k === 'w' || k === 'W') keys.m = false;
});
[['bl', 'l'], ['br', 'r'], ['bm', 'm']].forEach(([id, k]) => {
  const b = document.getElementById(id);
  b.addEventListener('pointerdown', e => { keys[k] = true; b.classList.add('on'); b.setPointerCapture(e.pointerId); });
  const off = () => { keys[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off);
});
function toUpgrade() {
  if (G.stage >= 3) { G.mode = 'win'; return; }
  G.pts += G.gain; G.stage++; G.mode = 'upgrade';
}

/* ---------- ballistics ---------- */
// launch angle (radians above horizontal, rightwards) to hit (tx,ty) from (x,y) with speed v; null if out of range
function solve(x, y, tx, ty, v, high) {
  const dx = tx - x, dy = ty - y, a = GR * dx * dx / (2 * v * v), disc = dx * dx - 4 * a * (a - dy);
  if (dx < 20 || disc < 0) return null;
  const u = (dx + (high ? 1 : -1) * Math.sqrt(disc)) / (2 * a);
  return Math.atan(u);
}
function pcenter() { return [G.p.x + 150, WL - 40]; }
function muzzle(i) { return [G.p.x + MUZ[i][0], WL + G.p.bob + MUZ[i][1]]; }
function aimAngle() {
  const [mx, my] = muzzle(0);
  return clamp(Math.atan2(my - mouse.y, mouse.x - mx), .05, 1.48);
}

/* ---------- entities ---------- */
const EN = {
  boat: () => ({ w: 96, h: 44, hp: 20, sc: 100, sp: 32, rate: 3.4, dmg: 10, ship: 1 }),
  cruiser: () => ({ w: 140, h: 62, hp: 46, sc: 250, sp: 24, rate: 2.7, dmg: 14, ship: 1.45 }),
  plane: () => ({ w: 40, h: 20, hp: 6, sc: 60, vx: -rnd(120, 170), air: true }),
  bomber: () => ({ w: 74, h: 30, hp: 18, sc: 150, vx: -70, air: true }),
  turret: () => ({ w: 36, h: 30, hp: 26, sc: 150, rate: 3.6, dmg: 12 })

  txt(Math.ceil(p.hp) + ' / ' + p.max, 178, 33, 11, '#fff', 'center', 500);
  txt('裝填', 24, 56, 12, '#c5d2da', 'left', 500);
  bar(64, 45, 228, 10, 1 - clamp(p.cd / reloadT(G.lv.reload), 0, 1), '#f0a93c');
  txt('飛彈', 24, 76, 12, '#c5d2da', 'left', 500);
  for (let i = 0; i < ammoV(G.lv.missile); i++) { g.fillStyle = i < p.ammo ? '#e8eef2' : 'rgba(255,255,255,.2)'; g.fillRect(64 + i * 17, 66, 12, 5); }
  txt('STAGE ' + G.stage + ' · ' + cfg.name, W - 16, 32, 15, '#fff', 'right');
  txt(D().n + '  SCORE ' + String(G.score).padStart(6, '0'), W - 16, 54, 14, '#ffe29a', 'right', 500);
  const b = G.boss;
  if (b) { const bw = 380, bx = 340; txt(cfg.bn, bx, 98, 14, '#ffb3a8', 'left'); bar(bx, 104, bw, 14, b.hp / b.maxhp, '#d9473a'); }
  else if (G.mode === 'play' && !G.bossDone) { bar(340, 20, 380, 6, G.killed / cfg.quota, 'rgba(255,255,255,.7)'); txt('BOSS', 728, 27, 11, '#ffb3a8', 'left', 500); }
}
function panel(x, y, w, h) { g.fillStyle = 'rgba(8,14,22,.9)'; g.fillRect(x, y, w, h); g.strokeStyle = 'rgba(255,255,255,.25)'; g.lineWidth = 1; g.strokeRect(x + .5, y + .5, w - 1, h - 1); }
function overlay(cfg) {
  const dim = a => { g.fillStyle = 'rgba(4,8,14,' + a + ')'; g.fillRect(0, 0, W, H); };
  if (G.mode === 'play' && G.banner > 0) {
    g.globalAlpha = clamp(G.banner, 0, 1);
    txt('STAGE ' + G.stage, W / 2, 200, 54, '#fff', 'center', 900); txt(cfg.name, W / 2, 240, 22, '#ffe29a', 'center'); g.globalAlpha = 1;
  }
  if (G.warn > 0 && Math.floor(G.warn * 4) % 2) {
    g.fillStyle = 'rgba(210,40,30,.22)'; g.fillRect(0, 0, W, H);
    txt('WARNING', W / 2, 220, 60, '#ff5a4a', 'center', 900); txt('Boss 接近', W / 2, 256, 20, '#fff', 'center');
  }
  if (G.mode === 'title') {
    dim(.5);
    txt('大和砲擊', W / 2, 190, 84, '#fff', 'center', 900);
    txt('調整角度、轟沉敵艦，過關強化你的戰艦', W / 2, 232, 20, '#ffe29a', 'center', 500);
    DIFF.forEach((d, i) => { button(d.n, 200 + i * 190, 290, 170, 50, () => newRun(i), { size: 22 }); txt(d.d, 285 + i * 190, 362, 12, '#c5d2da', 'center', 500); });
    txt('選擇難度開始　（鍵盤 1 / 2 / 3）', W / 2, 410, 15, '#fff', 'center', 500);
  } else if (G.mode === 'upgrade') {
    dim(.62); panel(110, 28, 740, 484);
    txt('強化戰艦', 140, 74, 30, '#fff');
    txt('第 ' + G.stage + ' 關 · ' + STG[G.stage - 1].name, 140, 98, 14, '#c5d2da', 'left', 500);
    txt('剩餘點數', 700, 66, 14, '#c5d2da', 'right', 500); txt(String(G.pts), 800, 76, 38, '#ffe29a', 'right', 900);
    UP.forEach((u, i) => {
      const y = 116 + i * 56, lv = G.lv[u.k];
      g.fillStyle = 'rgba(255,255,255,.05)'; g.fillRect(130, y, 700, 48);
      txt((i + 1) + '  ' + u.n, 146, y + 22, 18, '#fff');
      txt(u.d, 146, y + 40, 12, '#8ea0ad', 'left', 400);
      for (let k = 0; k < MAXLV; k++) { g.fillStyle = k < lv ? '#f0a93c' : 'rgba(255,255,255,.18)'; g.fillRect(400 + k * 24, y + 14, 18, 20); }
      txt(u.f(lv), 570, y + 30, 14, '#dde6ec', 'left', 500);
      button(lv >= MAXLV ? 'MAX' : '＋', 760, y + 7, 60, 34, () => buy(i), { off: G.pts <= 0 || lv >= MAXLV, size: 18 });
    });
    button('出擊', 380, 460, 200, 44, startStage, { size: 22 });
    txt('數字鍵 1–6 強化，Enter 出擊', 140, 487, 12, '#8ea0ad', 'left', 400);
  } else if (G.mode === 'clear') {
    dim(.55); txt('STAGE ' + G.stage + ' CLEAR', W / 2, 200, 62, '#ffe29a', 'center', 900);
    txt('擊沉 ' + cfg.bn, W / 2, 242, 22, '#fff', 'center', 500);
    txt(G.stage >= 3 ? '最終關完成' : '獲得強化點數 +' + G.gain, W / 2, 284, 22, '#ffd37a', 'center', 700);
    button(G.stage >= 3 ? '查看結果' : '強化戰艦', 380, 316, 200, 48, toUpgrade, { size: 20 });
  } else if (G.mode === 'dead') {
    dim(.6); txt('戰艦沉沒', W / 2, 210, 70, '#ff7a6a', 'center', 900);
    txt('得分 ' + G.score, W / 2, 252, 24, '#fff', 'center', 500);
    button('重打本關', 280, 290, 190, 48, startStage, { size: 20 });
    button('回標題', 490, 290, 190, 48, () => reset('title'), { size: 20, col: '#cfd9df', hov: '#fff' });
  } else if (G.mode === 'win') {
    dim(.55); txt('全艦隊殲滅', W / 2, 210, 70, '#ffe29a', 'center', 900);
    txt('最終得分 ' + G.score, W / 2, 252, 24, '#fff', 'center', 500);
    button('回標題', 390, 290, 180, 48, () => reset('title'), { size: 20 });
  }
}

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.033, (now - last) / 1000); last = now;
  update(dt); render(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__dbg = { get G() { return G; }, mouse, keys, newRun, startStage, jump(s) { G.stage = s; startStage(); } };
})();
</script>
